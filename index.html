<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EarthPlay</title>
    <meta name="description" content="A god simulator: shape a living pixel world, seed civilisations and watch them rise and fall.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="world"></canvas>

    <!-- ============================== Title screen -->
    <section id="title-screen">
        <div class="title-card">
            <h1 class="logo"><span class="l1">EARTH</span><span class="l2">PLAY</span></h1>
            <p class="tagline">Shape a living world. Watch civilisations rise — and fall.</p>
            <div class="title-critters" aria-hidden="true"></div>
            <button id="btn-continue" class="btn big ghost" hidden>Continue<small></small></button>
            <div id="title-form"></div>
            <div class="title-actions">
                <button id="btn-title-load" class="btn">Load world</button>
                <button id="btn-create" class="btn primary big">Create world</button>
            </div>
        </div>
    </section>

    <!-- ============================== In-game HUD -->
    <div id="hud" hidden>
        <header class="topbar">
            <div class="tb-group stats">
                <span class="mini-logo">EP</span>
                <span class="stat year" title="Current year"><b id="hud-year">Year 0</b></span>
                <span class="stat sky" id="hud-sky" title="Time of day & weather"><canvas data-icon="ui_sun" data-size="18"></canvas><span>Day</span></span>
                <span class="stat" title="People in realms"><canvas data-icon="ui_people" data-size="18"></canvas><b id="hud-pop">0</b><small>people</small></span>
                <span class="stat" title="All living creatures"><canvas data-icon="ui_paw" data-size="18"></canvas><b id="hud-life">0</b><small>creatures</small></span>
                <span class="stat" title="Standing realms"><canvas data-icon="ui_castle" data-size="18"></canvas><b id="hud-realms">0</b><small>realms</small></span>
            </div>
            <div class="tb-group speed" role="group" aria-label="Simulation speed">
                <button data-speed="0" title="Pause (Space)" aria-label="Pause"><canvas data-icon="ui_pause" data-size="18"></canvas></button>
                <button data-speed="1" title="Normal speed (1)">1×</button>
                <button data-speed="2" title="Fast (2)">2×</button>
                <button data-speed="5" title="Faster (3)">5×</button>
                <button data-speed="10" title="Fastest (4)">10×</button>
            </div>
            <div class="tb-group actions">
                <button id="btn-borders" class="tb-btn" title="Realm borders (B)"><canvas data-icon="ui_flag" data-size="18"></canvas><span>Borders</span></button>
                <button id="btn-realms" class="tb-btn" data-panel-btn="realms" title="Realms (K)"><canvas data-icon="ui_crown" data-size="18"></canvas><span>Realms</span></button>
                <button id="btn-chronicle" class="tb-btn" data-panel-btn="chronicle" title="Chronicle (C)"><canvas data-icon="ui_scroll" data-size="18"></canvas><span>Chronicle</span></button>
                <button id="btn-stats" class="tb-btn" data-panel-btn="stats" title="Statistics (G)"><canvas data-icon="ui_chart" data-size="18"></canvas><span>Stats</span></button>
                <span class="sep"></span>
                <button id="btn-save" class="tb-btn" title="Save (Ctrl+S quick-saves)"><canvas data-icon="ui_save" data-size="18"></canvas><span>Save</span></button>
                <button id="btn-load" class="tb-btn" title="Load (Ctrl+O)"><canvas data-icon="ui_load" data-size="18"></canvas><span>Load</span></button>
                <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings"><canvas data-icon="ui_gear" data-size="18"></canvas></button>
                <button id="btn-help" class="icon-btn" title="How to play (H)" aria-label="Help"><canvas data-icon="ui_help" data-size="18"></canvas></button>
                <button id="btn-menu" class="tb-btn accent" title="Create a new world"><canvas data-icon="ui_globe" data-size="18"></canvas><span>New world</span></button>
            </div>
        </header>

        <div id="feed" aria-live="polite"></div>

        <aside id="panel" hidden><div id="panel-body"></div></aside>

        <div id="minimap-wrap">
            <button id="btn-minimap" class="mm-toggle" title="Toggle minimap (M)" aria-label="Toggle minimap">Map</button>
            <canvas id="minimap"></canvas>
        </div>

        <nav id="dock" aria-label="God powers">
            <div id="dock-cats"></div>
            <div class="dock-row">
                <div id="dock-tools"></div>
                <div id="dock-brush">
                    <label for="brush-size">Brush</label>
                    <input id="brush-size" type="range" min="1" max="20" value="3">
                    <span id="brush-val">3</span>
                </div>
            </div>
        </nav>
    </div>

    <div id="tooltip" hidden></div>
    <div id="toasts"></div>
    <div id="modal-root" hidden></div>
    <div id="loading" hidden><div class="spinner"><i></i><i></i><i></i><i></i></div><p id="loading-text">Shaping the world…</p></div>

    <script src="js/core.js"></script>
    <script src="js/data.js"></script>
    <script src="js/world.js"></script>
    <script src="js/units.js"></script>
    <script src="js/civ.js"></script>
    <script src="js/powers.js"></script>
    <script src="js/vehicles.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/artbuild.js"></script>
    <script src="js/render.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
